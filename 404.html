<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to index.html with hash
      const path = window.location.pathname;
      const hash = path === '/' ? '' : '#' + path;
      window.location.replace('/' + hash + window.location.search);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
